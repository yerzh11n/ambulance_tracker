<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Live Location Sender</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>
    <h2>Геолокация отправляется...</h2>
    <div id="log" style="font-family: monospace;"></div>

    <script>
        // 1. Firebase config (ЗАМЕНИ на своё)
        const firebaseConfig = {
            apiKey: "AIzaSyCgzhNlNL8fj-wOM2wtxA3vvO3_iWVu38w",
            authDomain: "ambulancedispatcher401.firebaseapp.com",
            projectId: "ambulancedispatcher401",
            storageBucket: "ambulancedispatcher401.firebasestorage.app",
            messagingSenderId: "385680789545",
            appId: "1:385680789545:web:4915b681a1730be30f0c38",
            measurementId: "G-YV45BK0MH7"
        };  

        // 2. Инициализация Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 3. Чтение параметров из URL
        function getParam(name) {
            return new URLSearchParams(window.location.search).get(name) || "";
        }

        const vehicleId = getParam("id") || "ambulance_unknown";
        const driver = getParam("driver") || "Без имени";
        const status = getParam("status") || "Неизвестно";

        const log = document.getElementById("log");

        // 4. Функция отправки координат
        async function sendLocation() {
            if (!navigator.geolocation) {
                log.innerHTML += `<p>⚠️ Геолокация не поддерживается</p>`;
                return;
            }

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                const data = {
                    latitude: lat,
                    longitude: lng,
                    driver: driver,
                    status: status,
                    timestamp: new Date().toISOString()
                };

                try {
                    await db.collection("vehicles_location").doc(vehicleId).set(data);
                    log.innerHTML = `<p>✅ Обновлено ${new Date().toLocaleTimeString()} — ${JSON.stringify(data)}</p>`;
                } catch (e) {
                    log.innerHTML += `<p>❌ Ошибка: ${e.message}</p>`;
                }
            }, (error) => {
                log.innerHTML += `<p>❌ Геоошибка: ${error.message}</p>`;
            });
        }

        // 5. Повторять каждые 10 секунд
        sendLocation(); // первая отправка
        setInterval(sendLocation, 10000); // далее каждые 10 сек
    </script>
</body>
</html>
